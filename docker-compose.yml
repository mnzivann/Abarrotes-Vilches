version: '3.8'

services:
  web:
    build: .
    container_name: abarrotes_php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html/
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: abarrotes_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=AbarrotesVilches2026!
    ports:
      - "1433:1433"